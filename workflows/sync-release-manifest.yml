name: Sync website release feed

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  update-feed:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Update website release feed
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const manifestPath = 'updates.json';
            const versionPattern = /^\d+(?:\.\d+){1,3}$/;
            const compareVersions = (left, right) => {
              const a = left.split('.').map(Number);
              const b = right.split('.').map(Number);
              for (let index = 0; index < Math.max(a.length, b.length); index += 1) {
                const difference = (a[index] || 0) - (b[index] || 0);
                if (difference) return difference;
              }
              return 0;
            };
            const parseRelease = (release) => {
              const version = release.tag_name.replace(/^v/i, '');
              if (!versionPattern.test(version)) return null;
              const installer = release.assets.find((asset) =>
                /^EvolveAbyss-Prototype-\d+-Setup\.exe$/i.test(asset.name)
              );
              if (!installer) return null;
              const bodyLines = (release.body || '').split(/\r?\n/).map((line) => line.trim()).filter(Boolean);
              const heading = bodyLines.find((line) => /^#{1,3}\s/.test(line));
              const title = release.name?.trim() || (heading ? heading.replace(/^#{1,3}\s*/, '') : `Prototype ${version}`);
              let notes = bodyLines
                .filter((line) => /^[-*•]\s|^\d+[.)]\s/.test(line))
                .map((line) => line.replace(/^([-*•]|\d+[.)])\s*/, '').trim())
                .filter(Boolean)
                .slice(0, 12);
              if (notes.length === 0) {
                notes = bodyLines
                  .filter((line) => line !== heading)
                  .map((line) => line.replace(/^#{1,6}\s*/, '').trim())
                  .filter(Boolean)
                  .slice(0, 12);
              }
              return {
                version,
                title: title.slice(0, 120),
                publishedAt: release.published_at || '',
                downloadUrl: installer.browser_download_url,
                notes
              };
            };

            const releaseResponse = await github.rest.repos.listReleases({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100
            });
            const published = releaseResponse.data
              .filter((release) => !release.draft && !release.prerelease)
              .map(parseRelease)
              .filter(Boolean)
              .sort((left, right) => compareVersions(right.version, left.version));
            const eventVersion = context.payload.release.tag_name.replace(/^v/i, '');
            if (!published.some((release) => release.version === eventVersion)) {
              throw new Error(`Published release ${eventVersion} must include an EvolveAbyss-Prototype-N-Setup.exe asset.`);
            }
            const latest = published[0];

            const previous = JSON.parse(fs.readFileSync(manifestPath, 'utf8'));
            const releasesByVersion = new Map(published.map((release) => [release.version, release]));
            for (const release of previous.releases || []) {
              if (!releasesByVersion.has(release.version)) releasesByVersion.set(release.version, release);
            }
            const releases = [...releasesByVersion.values()]
              .sort((left, right) => {
                const a = left.version.split('.').map(Number);
                const b = right.version.split('.').map(Number);
                for (let index = 0; index < Math.max(a.length, b.length); index += 1) {
                  const difference = (b[index] || 0) - (a[index] || 0);
                  if (difference) return difference;
                }
                return 0;
              })
              .slice(0, 30);

            fs.writeFileSync(manifestPath, `${JSON.stringify({
              latestVersion: latest.version,
              downloadUrl: latest.downloadUrl,
              releaseNotes: latest.notes.join('\n'),
              releases
            }, null, 2)}\n`);

      - name: Commit refreshed feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add updates.json
          if git diff --cached --quiet; then
            echo "Release feed is already up to date."
          else
            git commit -m "chore: sync website release feed"
            git push
          fi
